services:
  tempdesk-guest:
    env_file: !override
      - path: /run/tempdesk-appliance/guest.env
        format: raw
    ports: !override ["${TEMPDESK_LAN_ADDRESS:?Set by appliance setup}:8080:8080"]
    restart: "no"
  tempdesk-admin:
    env_file: !override
      - path: /run/tempdesk-appliance/management.env
        format: raw
    ports: !override ["${TEMPDESK_LAN_ADDRESS:?Set by appliance setup}:8081:8081"]
    restart: "no"
