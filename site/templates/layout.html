<script>/* apply saved theme and motion before first paint */try{var d=document.documentElement,t=localStorage.getItem('td.theme'),m=localStorage.getItem('td.motion'),s=localStorage.getItem('td.size');if(t&&t!=='system')d.setAttribute('data-theme',t);if(m)d.setAttribute('data-motion',m);if(s)d.style.setProperty('--text-scale',s);}catch(e){}</script>
