name: Release TempDesk Deployer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Record the start time
        id: start
        shell: pwsh
        run: |
          "utc=$((Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ'))" >> $env:GITHUB_OUTPUT
          "epoch=$([DateTimeOffset]::UtcNow.ToUnixTimeSeconds())" >> $env:GITHUB_OUTPUT

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Work out the version
        id: ver
        shell: pwsh
        run: |
          $base = (Get-Content deployer/app/package.json -Raw | ConvertFrom-Json).version
          $parts = $base.Split('.')
          # Squirrel needs three numeric parts: major.minor.<run number>.
          $version = '{0}.{1}.{2}' -f $parts[0], $parts[1], $env:GITHUB_RUN_NUMBER
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Seed the previous full package for delta generation
        id: prev
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Squirrel makes a delta against the newest previous full package. Syncing the whole
          # GitHub feed downloads every old package in parallel and fails on file locks, so only
          # the newest full package and a one-line RELEASES are served to it from a local folder.
          $prev = gh release list --limit 1 --json tagName --jq '.[0].tagName' 2>$null
          if (-not $prev) { Write-Host 'No previous release: full package only.'; exit 0 }
          $seed = Join-Path $env:RUNNER_TEMP 'squirrel-seed'
          New-Item -ItemType Directory -Force -Path $seed | Out-Null
          gh release download $prev --pattern RELEASES --dir $seed --clobber
          $lines = Get-Content (Join-Path $seed 'RELEASES') | Where-Object { $_ -match '-full\.nupkg' }
          if (-not $lines) { Write-Host 'Previous release has no full package: full package only.'; exit 0 }
          $newest = $lines | Sort-Object { [version](($_ -split ' ')[1] -replace '^.*-(\d+\.\d+\.\d+)-full\.nupkg$', '$1') } | Select-Object -Last 1
          $name = ($newest -split ' ')[1]
          gh release download $prev --pattern $name --dir $seed --clobber
          [IO.File]::WriteAllText((Join-Path $seed 'RELEASES'), $newest.TrimStart([char]0xFEFF))
          Start-Process -FilePath python -ArgumentList '-m', 'http.server', '8765', '--bind', '127.0.0.1', '--directory', $seed -WindowStyle Hidden
          Start-Sleep -Seconds 2
          "remote=http://127.0.0.1:8765" >> $env:GITHUB_OUTPUT
          Write-Host "Delta base: $name from $prev"

      - name: Build and package the installer (unsigned)
        shell: cmd
        env:
          TEMPDESK_VERSION: ${{ steps.ver.outputs.version }}
          TEMPDESK_REMOTE_RELEASES: ${{ steps.prev.outputs.remote }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: build-installer.bat /s

      - name: Confirm Setup.exe is not signed
        shell: pwsh
        run: |
          $s = Get-AuthenticodeSignature deployer/output/squirrel-windows/Setup.exe
          Write-Host "Setup.exe signature status: $($s.Status)"
          if ($s.Status -ne 'NotSigned') { throw "Setup.exe must be unsigned, got $($s.Status)" }

      - name: Write the release notes
        id: notes
        shell: pwsh
        run: |
          $end = (Get-Date).ToUniversalTime()
          $startEpoch = [int64]'${{ steps.start.outputs.epoch }}'
          $secs = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds() - $startEpoch
          $dur = '{0}m {1}s' -f [math]::Floor($secs / 60), ($secs % 60)
          $lines = & ./scripts/line-counts.ps1
          $notes = @(
            "TempDesk Deployer ${{ steps.ver.outputs.version }} built from ${{ github.sha }}.",
            '',
            'Install with **Setup.exe**. Installed copies update themselves from this release feed and ask before restarting.',
            'The installer and the app are **not code-signed** (owner decision), so Windows SmartScreen may warn on first run.',
            '',
            '| Workflow | UTC |',
            '| --- | --- |',
            "| Started | ${{ steps.start.outputs.utc }} |",
            "| Finished | $($end.ToString('yyyy-MM-ddTHH:mm:ssZ')) |",
            "| Duration | $dur |",
            '',
            '### Lines of code',
            ''
          ) + $lines
          Set-Content -Path release-notes.md -Value ($notes -join "`n") -Encoding utf8

      - name: Publish the GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $o = 'deployer/output/squirrel-windows'
          $v = '${{ steps.ver.outputs.version }}'
          # Publish only this version's packages, and a RELEASES feed that lists only them.
          $mine = Get-ChildItem $o -Filter "*-$v-*.nupkg"
          if (-not ($mine | Where-Object Name -like '*-full.nupkg')) { throw "No full package for $v" }
          $feed = Get-Content "$o/RELEASES" | Where-Object { $_ -match [regex]::Escape("-$v-") }
          [IO.File]::WriteAllText("$o/RELEASES", ($feed -join "`r`n"))
          Write-Host "RELEASES:"; Get-Content "$o/RELEASES" | Write-Host
          $assets = @("$o/Setup.exe", "$o/RELEASES") + ($mine | ForEach-Object FullName)
          $portable = Get-ChildItem deployer/bin -Filter '*portable*.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($portable) { $assets += $portable.FullName }
          gh release create '${{ steps.ver.outputs.tag }}' @assets --title 'TempDesk Deployer ${{ steps.ver.outputs.tag }}' --notes-file release-notes.md --target '${{ github.sha }}'
