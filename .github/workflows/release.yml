name: Release TempDesk Deployer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check release source and tools
        shell: pwsh
        run: |
          foreach ($tool in @('gh', 'git', 'python', 'cmd')) {
            if (-not (Get-Command $tool -ErrorAction SilentlyContinue)) { throw "Missing release tool $tool on windows-2025." }
          }
          if ($env:GITHUB_REF -ne 'refs/heads/main') { throw 'Publish from the main branch.' }
          git merge-base --is-ancestor $env:GITHUB_SHA refs/remotes/origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Cannot verify source lineage on main.' }

      - name: Work out the version
        id: ver
        shell: pwsh
        run: |
          $base = (Get-Content deployer/app/package.json -Raw | ConvertFrom-Json).version
          $parts = $base.Split('.')
          # Squirrel needs three numeric parts: major.minor.<run number>.
          $version = '{0}.{1}.{2}' -f $parts[0], $parts[1], $env:GITHUB_RUN_NUMBER
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Seed the previous full package for delta generation
        id: prev
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.ORG_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          # Squirrel makes a delta against the newest previous full package. Syncing the whole
          # GitHub feed downloads every old package in parallel and fails on file locks, so only
          # the newest full package and a one-line RELEASES are served to it from a local folder.
          $prev = gh release list --exclude-drafts --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName'
          if ($LASTEXITCODE -ne 0) { throw 'Cannot list previous releases.' }
          if (-not $prev) { Write-Host 'No previous release: full package only.'; exit 0 }
          $seed = Join-Path $env:RUNNER_TEMP 'squirrel-seed'
          New-Item -ItemType Directory -Force -Path $seed | Out-Null
          gh release download $prev --pattern RELEASES --dir $seed --clobber
          $lines = Get-Content (Join-Path $seed 'RELEASES') | Where-Object { $_ -match '-full\.nupkg' }
          if (-not $lines) { Write-Host 'Previous release has no full package: full package only.'; exit 0 }
          $newest = $lines | Sort-Object { [version](($_ -split ' ')[1] -replace '^.*-(\d+\.\d+\.\d+)-full\.nupkg$', '$1') } | Select-Object -Last 1
          $name = ($newest -split ' ')[1]
          gh release download $prev --pattern $name --dir $seed --clobber
          [IO.File]::WriteAllText((Join-Path $seed 'RELEASES'), $newest.TrimStart([char]0xFEFF))
          Start-Process -FilePath python -ArgumentList '-m', 'http.server', '8765', '--bind', '127.0.0.1', '--directory', $seed -WindowStyle Hidden
          Start-Sleep -Seconds 2
          "remote=http://127.0.0.1:8765" >> $env:GITHUB_OUTPUT
          Write-Host "Delta base: $name from $prev"

      - name: Build and package the installer (unsigned)
        shell: cmd
        env:
          TEMPDESK_VERSION: ${{ steps.ver.outputs.version }}
          TEMPDESK_REMOTE_RELEASES: ${{ steps.prev.outputs.remote }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: build-installer.bat /s


      - name: Publish and read back the source-bound release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.ORG_TOKEN || secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.ver.outputs.version }}
          RELEASE_EVIDENCE: ${{ runner.temp }}/tempdesk-release-evidence
        run: ./scripts/publish-release.ps1

      - name: Collect release files and job context
        if: ${{ always() }}
        continue-on-error: true
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.ver.outputs.version }}
          RELEASE_EVIDENCE: ${{ runner.temp }}/tempdesk-release-evidence
          RELEASE_JOB_STATUS: ${{ job.status }}
        run: ./scripts/collect-release-evidence.ps1

      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        continue-on-error: true
        with:
          name: tempdesk-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/tempdesk-release-evidence/
          if-no-files-found: warn
          retention-days: 7
