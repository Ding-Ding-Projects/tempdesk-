name: Release TempDesk Deployer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  release:
    concurrency:
      group: release
      cancel-in-progress: false
    outputs:
      release_tag: ${{ steps.publish.outputs.release_tag }}
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check release source and tools
        shell: pwsh
        run: |
          foreach ($tool in @('gh', 'git', 'cmd')) {
            if (-not (Get-Command $tool -ErrorAction SilentlyContinue)) { throw "Missing release tool $tool on windows-2025." }
          }
          if ($env:GITHUB_REF -ne 'refs/heads/main') { throw 'Publish from the main branch.' }
          git merge-base --is-ancestor $env:GITHUB_SHA refs/remotes/origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Cannot verify source lineage on main.' }

      - name: Work out the version
        id: ver
        shell: pwsh
        run: |
          $base = (Get-Content deployer/app/package.json -Raw | ConvertFrom-Json).version
          $parts = $base.Split('.')
          # Squirrel needs three numeric parts: major.minor.<run number>.
          $version = '{0}.{1}.{2}' -f $parts[0], $parts[1], $env:GITHUB_RUN_NUMBER
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Seed the previous full package for delta generation
        id: prev
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.ORG_TOKEN || secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $current = [version]$env:RELEASE_VERSION
          $tags = gh release list --exclude-drafts --exclude-pre-releases --limit 100 --json tagName --jq '.[].tagName'
          $older = foreach ($tag in $tags) {
            if ($tag -cmatch '^v(\d+\.\d+\.\d+)$') {
              $number = [version]$Matches[1]
              if ($number -lt $current) { $number }
            }
          }
          $selected = $null
          foreach ($previous in ($older | Sort-Object -Descending)) {
            $tag = "v$previous"
            $name = "TempDeskDeployer-$previous-full.nupkg"
            $release = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$tag" | ConvertFrom-Json
            $package = $release.assets | Where-Object { $_.name -ceq $name -and $_.state -ceq 'uploaded' }
            $manifest = $release.assets | Where-Object { $_.name -ceq 'RELEASES' -and $_.state -ceq 'uploaded' }
            if (!$release.draft -and !$release.prerelease -and $package -and $manifest) {
              $selected = @($package, $manifest)
              break
            }
          }
          if (!$selected) { Write-Host 'No older compatible release: full package only.'; exit 0 }

          $seed = Join-Path $env:RUNNER_TEMP ('squirrel-seed-' + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $seed | Out-Null
          gh release download $tag --pattern RELEASES --pattern $name --dir $seed
          foreach ($asset in $selected) {
            $file = Get-Item -LiteralPath (Join-Path $seed $asset.name)
            if ($file.Length -le 0 -or $file.Length -ne $asset.size) { throw 'Previous release asset size mismatch.' }
            if ($asset.digest -and ('sha256:' + (Get-FileHash -LiteralPath $file.FullName).Hash.ToLowerInvariant()) -cne $asset.digest) {
              throw 'Previous release asset digest mismatch.'
            }
          }
          $feed = Join-Path $seed 'RELEASES'
          $rows = @(Get-Content -LiteralPath $feed | Where-Object { ($_ -split '\s+')[1] -ceq $name })
          if ($rows.Count -ne 1) { throw 'Previous release feed does not name exactly one matching full package.' }
          [IO.File]::WriteAllLines($feed, [string[]]$rows)
          "directory=$seed" >> $env:GITHUB_OUTPUT
          Write-Host "Delta base: $name from $tag"

      - name: Build and package the installer (unsigned)
        shell: cmd
        env:
          TEMPDESK_VERSION: ${{ steps.ver.outputs.version }}
          TEMPDESK_SQUIRREL_SEED: ${{ steps.prev.outputs.directory }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: build-installer.bat /s

      - name: Build the portable build companion (unsigned)
        shell: cmd
        env:
          TEMPDESK_VERSION: ${{ steps.ver.outputs.version }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: build.bat --build-companion /s --skip-tests

      - name: Publish and read back the source-bound release
        id: publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.ORG_TOKEN || secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.ver.outputs.version }}
          RELEASE_EVIDENCE: ${{ runner.temp }}/tempdesk-release-evidence
        run: |
          ./scripts/publish-release.ps1
          "release_tag=v$env:RELEASE_VERSION" >> $env:GITHUB_OUTPUT

      - name: Collect release files and job context
        if: ${{ always() }}
        continue-on-error: true
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.ver.outputs.version }}
          RELEASE_EVIDENCE: ${{ runner.temp }}/tempdesk-release-evidence
          RELEASE_JOB_STATUS: ${{ job.status }}
        run: ./scripts/collect-release-evidence.ps1

      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        continue-on-error: true
        with:
          name: tempdesk-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/tempdesk-release-evidence/
          if-no-files-found: warn
          retention-days: 7

  portal-image:
    needs: release
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/portal-image.yml
    with:
      release_tag: ${{ needs.release.outputs.release_tag }}
