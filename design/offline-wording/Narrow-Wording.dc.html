<!doctype html>
<html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Offline reader wording preview</title>
<link rel="stylesheet" href="../../site/assets/site.css"><link rel="stylesheet" href="../guided-documentation/guided-docs.css">
<style>
*{box-sizing:border-box}.preview{position:relative;isolation:isolate;max-width:360px;min-height:min(100vh,720px);background:var(--ground);color:var(--text);font-family:var(--font);container-type:inline-size;--brand:var(--primary)}
.preview[data-accent^="#"]{--brand:var(--preview-accent)}.head,.fixture,.actions{display:flex;align-items:center;flex-wrap:wrap;gap:8px}.head{padding:14px var(--gutter);border-bottom:1px solid var(--outline)}.head strong{margin-inline-end:auto}.reader{display:grid;grid-template-columns:minmax(0,1fr) minmax(260px,340px);gap:24px;padding:20px var(--gutter)}.article,.settings,.notice{min-width:0;overflow-wrap:anywhere}.settings,.notice{padding:16px;border:1px solid var(--outline2);border-radius:18px;background:var(--s1)}.settings{align-self:start}.settings h2,.notice p{margin-top:0}.settings label{display:flex;align-items:center;gap:8px;min-height:48px}.settings input[type=range]{height:48px;max-width:100%}.fixture{padding:12px var(--gutter);border-top:1px solid var(--outline)}button,select,input[type=file]{max-width:100%;min-height:48px;font:inherit}.notice{margin:8px var(--gutter);border-inline-start:4px solid var(--danger)}.layer{pointer-events:none;position:fixed;inset:0;z-index:99;display:grid;place-items:center;background:color-mix(in srgb,var(--brand) 10%,transparent)}.layer strong{max-inline-size:min(480px,calc(100% - 32px));overflow-wrap:anywhere;background:var(--s1);color:var(--text);border:2px solid var(--brand);border-radius:24px;padding:16px 28px;text-align:center}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}[hidden]{display:none!important}.preview.dragging{outline:3px solid var(--brand);outline-offset:-3px}
@container(max-width:620px){.reader{display:flex;flex-direction:column;gap:12px}.settings{width:100%}.settings input[type=file]{width:100%}}
@media(prefers-reduced-motion:no-preference){.preview:not([data-motion=false]) .layer strong{animation:entry 180ms ease-out}@keyframes entry{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}}
</style></head><body><x-dc><div class="preview" data-motion="{{motion}}" data-accent="{{accentColor}}" style="--preview-accent:{{accentColor}}">
<header class="head"><strong>TempDesk Offline Guide</strong><label><span data-t="lang"></span> <select id="lang"><option value="en">English</option><option value="zh">廣東話</option><option value="bi">English / 廣東話</option></select></label></header>
<main class="reader"><article class="article"><h1 data-t="article"></h1><p data-t="intro"></p><label><input type="checkbox"> <span data-t="task"></span></label><p data-t="drop"></p></article>
<section class="settings"><h2 data-t="settings"></h2><button type="button" id="choose" data-t="upload"></button><input class="sr" type="file" id="upload" tabindex="-1" aria-hidden="true" accept=".json,application/json"><h3 data-t="audio"></h3><label><input id="sound" type="checkbox" checked><span data-t="switch"></span></label><label for="vol" data-t="volume"></label><input id="vol" type="range" min="0" max="100" value="60"><output for="vol" id="level">60%</output></section></main>
<section id="notice" class="notice" hidden><p data-t="reject"></p><button type="button" id="dismiss" data-t="dismiss"></button></section>
<footer class="fixture"><small data-t="fixture"></small><button id="valid" data-t="valid"></button><button id="invalid" data-t="invalid"></button></footer>
<div class="layer" hidden aria-hidden="true"><strong data-t="success"></strong></div><div class="sr" role="status" aria-live="polite" id="status"></div></div></x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":800},"accentColor":{"type":"color","default":"#006A61","editor":"color","label":"Accent colour"},"motion":{"type":"boolean","default":true,"editor":"toggle","label":"Motion"}}'>
class Component extends DCLogic { renderVals(){return {accentColor:this.props?.accentColor??"#006A61",motion:this.props?.motion??true};} }
</script><script src="wording-demo.js"></script></body></html>
