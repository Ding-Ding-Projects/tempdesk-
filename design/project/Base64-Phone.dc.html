<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Base64 tools on a phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; font-family: 'Segoe UI Variable','Segoe UI',Roboto,system-ui,sans-serif; background: #0B1110; color: #E8F1EF; display: flex; flex-direction: column; overflow: hidden">
  <div style="padding: 18px 16px 12px; display: flex; align-items: center; gap: 10px">
    <span style="font-weight: 800; font-size: 22px; flex: 1">Base64</span>
    <div role="tablist" aria-label="Direction" style="display: flex; padding: 3px; border-radius: 999px; background: #121A19; border: 1px solid #22322F">
      <button type="button" role="tab" aria-selected="false" style="height: 40px; padding: 0 14px; border-radius: 20px; border: 0; background: transparent; color: #A9BBB8">Encode</button>
      <button type="button" role="tab" aria-selected="true" style="height: 40px; padding: 0 14px; border-radius: 20px; border: 0; background: #7CF3E6; color: #04201D; font-weight: 800">Decode</button>
    </div>
  </div>
  <div style="padding: 0 16px 10px; display: flex; gap: 6px; overflow-x: auto">
    <span style="flex: none; height: 36px; padding: 0 12px; border-radius: 18px; background: #1F3A36; color: #7CF3E6; display: flex; align-items: center; font-size: 13px; font-weight: 700">Standard</span>
    <span style="flex: none; height: 36px; padding: 0 12px; border-radius: 18px; border: 1px solid #22322F; color: #A9BBB8; display: flex; align-items: center; font-size: 13px">Strict</span>
    <span style="flex: none; height: 36px; padding: 0 12px; border-radius: 18px; border: 1px solid #22322F; color: #A9BBB8; display: flex; align-items: center; font-size: 13px">UTF-8</span>
  </div>
  <div style="flex: 1; padding: 0 16px 16px; display: flex; flex-direction: column; gap: 12px; min-height: 0">
    <div style="padding: 14px; border-radius: 18px; background: #121A19; border: 1px solid #FFB8A3; font-family: 'Cascadia Mono',Consolas,monospace; font-size: 14px; color: #E8F1EF; word-break: break-all; line-height: 1.6">iVBORw0KGgo<span style="background: #5A3A31; color: #FFB8A3; border-radius: 3px; padding: 0 2px">*</span>AAAANSUhEUgAAAEAAAABACAYAAACqaXHeAAAA</div>
    <div role="alert" style="padding: 12px 14px; border-radius: 14px; background: #2B1A15; color: #FFB8A3; font-size: 14px; line-height: 1.45"><strong>Character 12 is not Base64.</strong> Turn off Strict to ignore it, or remove it.</div>
    <div style="padding: 14px; border-radius: 18px; background: #16211F; border: 1px solid #2E4642; display: flex; gap: 12px; align-items: center">
      <span style="width: 56px; height: 56px; border-radius: 12px; background: #2D4642; flex: none"></span>
      <div style="min-width: 0"><div style="font-weight: 700">PNG image, 64 x 64</div><div style="color: #8EA29E; font-size: 13px">Detected from the file signature</div></div>
    </div>
  </div>
  <div style="padding: 12px 16px 26px; background: #0F1716; border-top: 1px solid #1D2A28; display: flex; gap: 10px">
    <button type="button" style="flex: 1; height: 52px; border-radius: 26px; border: 1px solid #2E4642; background: transparent; color: #E8F1EF; font-weight: 700; font-size: 16px">Paste</button>
    <button type="button" style="flex: 1; height: 52px; border-radius: 26px; border: 0; background: #7CF3E6; color: #04201D; font-weight: 800; font-size: 16px">Save file</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
