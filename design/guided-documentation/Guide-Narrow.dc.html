<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Guided documentation phone</title>
  <link rel="stylesheet" href="../../site/assets/site.css">
  <link rel="stylesheet" href="guided-docs.css">
  <script src="artboard.js" defer></script>
</head>
<body>
<x-dc>
  <div id="guide-reference" data-edition="core" data-language="bi" data-artboard-motion="{{motion}}" style="--artboard-accent:{{accentColor}}"></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":960},"accentColor":{"type":"color","default":"#006A61","editor":"color","label":"Accent colour"},"motion":{"type":"boolean","default":true,"editor":"toggle","label":"Motion"}}'>
class Component extends DCLogic {
  renderVals() {
    return {accentColor: this.props?.accentColor ?? "#006A61", motion: this.props?.motion ?? true};
  }
}
</script>
</body>
</html>
