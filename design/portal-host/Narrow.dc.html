<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TempDesk Portal Host · Narrow design reference</title><link rel="stylesheet" href="board.css"></head>
<body><x-dc><div class="board" style="--board-accent:{{accentColor}}" data-board-motion="{{motionMode}}"><main>
<header><strong>TempDesk Portal Host</strong><span class="toolbar" aria-label="Design preview controls">
<label>Language / 語言 <select id="lang"><option value="en">English</option><option value="zh-HK">廣東話</option><option value="bi">English + 廣東話</option></select></label>
<label>Fixture / 範例 <select id="fixture"><option value="none">Normal / 正常</option><option value="engine">Engine offline / 引擎離線</option><option value="receipt">Unaccepted receipt / 紀錄未獲接納</option><option value="health">Management unavailable / 管理服務未就緒</option></select></label>
<label>Accent / 主色 <input aria-label="Accent / 主色" id="accent" type="color" value="#7cf3e6"></label><label><input id="motion" type="checkbox" checked>Motion / 動態</label>
</span></header>
<div class="shell"><aside aria-label="Setup steps"><ol id="steps"></ol></aside><article class="enter"><div id="phase" class="progress"></div><h1 id="label" tabindex="-1"></h1><div id="content"></div><footer><span>Design preview · 設計預覽</span><div class="row" id="actions"></div></footer></article></div>
</main></div></x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":800},"accentColor":{"type":"color","default":"#7CF3E6","editor":"color","label":"Accent colour"},"motion":{"type":"boolean","default":true,"editor":"toggle","label":"Motion"}}'>
class Component extends DCLogic {renderVals(){return {accentColor:this.props?.accentColor??"#7CF3E6",motionMode:this.props?.motion===false?"off":"on"};}}
</script><script src="board.js"></script></body></html>
