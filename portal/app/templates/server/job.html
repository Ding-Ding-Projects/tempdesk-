{% extends "layouts/admin.html" %}
{% block title %}{{ ta("Working") }}{% endblock %}
{% block content %}
<link rel="stylesheet" href="/static/css/server.css">
<div class="srv" id="srv-job-root" data-job-id="{{ job_id }}" data-status-url="/server/jobs/{{ job_id }}/status">
  <div class="srv-head"><h1>{{ t("Working") }}</h1></div>
  <section class="srv-card">
    <p>{{ t("State") }}: <strong id="srv-job-state">...</strong></p>
    <div id="srv-job-bar" class="srv-progress"><span></span></div>
    <pre id="srv-job-output" class="srv-console" style="min-height:120px"></pre>
    <pre id="srv-job-errors" class="srv-console err" hidden style="min-height:40px"></pre>
  </section>
</div>
{% endblock %}
{% block scripts %}<script src="/static/js/server-jobs.js"></script>{% endblock %}
