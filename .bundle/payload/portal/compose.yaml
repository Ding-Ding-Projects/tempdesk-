# TempDesk portals. Run from this folder: docker compose up -d --build
# The build context is the repository root so docs and the changelog are bundled.
services:
  tempdesk-guest:
    build:
      context: ..
      dockerfile: portal/Dockerfile
    image: tempdesk-portal:latest
    env_file: .env.guest
    ports:
      - "0.0.0.0:8080:8080"   # reachable from the LAN by owner decision
    read_only: true
    tmpfs:
      - /tmp
    environment:
      PORTAL_MODE: guest
      PORT: "8080"
      PORTAL_STATE_DIR: /state
    volumes:
      # Same data volume, read only: the guest portal only reads the org logo.
      - tempdesk-portal-data:/data:ro
      # Own writable volume for sessions, rate limits and the encrypted one-time store.
      - tempdesk-guest-state:/state
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  tempdesk-admin:
    image: tempdesk-portal:latest
    depends_on: [tempdesk-guest]
    env_file: .env.admin
    environment:
      PORTAL_MODE: admin
      PORT: "8081"
    ports:
      - "0.0.0.0:8081:8081"
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      # Personal wording, logo, onboarding state, version history and the undo Git repository.
      - tempdesk-portal-data:/data
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

volumes:
  tempdesk-portal-data:
  tempdesk-guest-state:
