# TempDesk Lite: Samba AD domain controller plus the TempDesk agent.
#
# The DC gets its own IP address on your LAN through a macvlan network,
# because Windows clients must reach DNS 53, Kerberos 88/464, LDAP 389/636,
# SMB 445, RPC 135 plus the dynamic range 49152-65535, Global Catalog
# 3268/3269 and NTP 123 directly on the DC's address. Publishing that many
# ports through the host would collide with the host's own services
# (DNS on 53, for example) and does not work for the dynamic RPC range.
#
# Copy .env.example to .env, fill it in, create secrets/admin_password,
# then run: docker compose up -d --build
name: tempdesk-lite

services:
  dc:
    build: .
    image: tempdesk-lite:latest
    hostname: ${DC_HOSTNAME:-dc1}
    domainname: ${DOMAIN_FQDN:?set DOMAIN_FQDN in .env}
    restart: unless-stopped
    environment:
      REALM: ${REALM:?set REALM in .env}
      NETBIOS: ${NETBIOS:?set NETBIOS in .env}
      DC_HOSTNAME: ${DC_HOSTNAME:-dc1}
      DC_IP: ${DC_IP:?set DC_IP in .env}
      DNS_FORWARDER: ${DNS_FORWARDER:-1.1.1.1}
      INITIAL_ADMIN: ${INITIAL_ADMIN:-Administrator}
      ADMIN_PASSWORD_FILE: /run/secrets/admin_password
    secrets:
      - admin_password
    # SYS_ADMIN lets Samba store NT ACLs in the security.* extended
    # attribute namespace on SYSVOL. No full privileged mode is needed.
    cap_add:
      - SYS_ADMIN
    # The internal DNS server must not be overridden by Docker's resolver.
    dns:
      - 127.0.0.1
    dns_search:
      - ${DOMAIN_FQDN}
    volumes:
      - samba-data:/var/lib/samba
      - samba-etc:/etc/samba
      - tempdesk-data:/var/lib/tempdesk
      - ../client:/opt/tempdesk/client:ro
    networks:
      lan:
        ipv4_address: ${DC_IP}
    healthcheck:
      test: ["CMD", "/usr/local/sbin/tempdesk-healthcheck"]
      interval: 30s
      timeout: 15s
      start_period: 180s
      retries: 3
    stop_grace_period: 30s

networks:
  lan:
    driver: macvlan
    driver_opts:
      parent: ${LAN_PARENT_IF:?set LAN_PARENT_IF in .env}
    ipam:
      config:
        - subnet: ${LAN_SUBNET:?set LAN_SUBNET in .env}
          gateway: ${LAN_GATEWAY:?set LAN_GATEWAY in .env}
          # Optional: keep Docker from handing out other addresses in the
          # LAN range. DC_IP must be inside this range or outside the
          # router's DHCP pool.
          ip_range: ${LAN_IP_RANGE:-${DC_IP}/32}

volumes:
  samba-data:
  samba-etc:
  tempdesk-data:

secrets:
  admin_password:
    file: ./secrets/admin_password
